<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 — Мини-игра</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;touch-action:none;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center}
.header{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:380px;padding:12px 16px;font-weight:600;font-size:1.05rem}
.back-link{color:#94a3b8;text-decoration:none;font-size:.95rem}
.board-wrap{position:relative;width:92vw;max-width:360px;aspect-ratio:1/1;background:#1e293b;border-radius:16px;padding:10px;border:2px solid #334155;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:100%;height:100%}
.cell{background:#0f172a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem;transition:transform .1s,background .15s}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.88);backdrop-filter:blur(4px);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:2}
.hidden{display:none!important}
h1{margin:0 0 8px;font-size:1.75rem;color:#facc15}
p{margin:0 0 18px;color:#cbd5e1;font-size:.95rem;line-height:1.4}
.btn{padding:12px 26px;font-size:1rem;font-weight:700;color:#0f172a;background:#facc15;border:none;border-radius:12px;cursor:pointer}
.new-btn{margin-top:16px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;font-size:.92rem;padding:10px 22px}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back-link">← На главную</a>
<div>Счёт: <span id="score">0</span></div>
<div>🏆 <span id="best">0</span></div>
</div>
<div class="board-wrap">
<div class="grid" id="grid"></div>
<div id="overScreen" class="overlay hidden">
<h1 style="color:#f87171">💥 Ходов нет!</h1>
<p id="finalText">Ваш счёт: 0</p>
<button id="restartBtn" class="btn">Сыграть ещё</button>
</div>
</div>
<button id="newGameBtn" class="btn new-btn">Новая игра</button>
<script>
const gridEl=document.getElementById('grid'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overScreen=document.getElementById('overScreen'),finalText=document.getElementById('finalText');
const colors={0:['#0f172a','transparent'],2:['#1e293b','#f8fafc'],4:['#334155','#f8fafc'],8:['#0284c7','#fff'],16:['#0369a1','#fff'],32:['#2563eb','#fff'],64:['#4f46e5','#fff'],128:['#7c3aed','#fff'],256:['#9333ea','#fff'],512:['#db2777','#fff'],1024:['#e11d48','#fff'],2048:['#facc15','#0f172a']};
let board=[],score=0,best=Number(localStorage.getItem('best2048'))||0,tx=0,ty=0;
bestEl.textContent=best;

function init(){
    board=Array.from({length:4},()=>[0,0,0,0]);
    score=0;scoreEl.textContent=0;
    overScreen.classList.add('hidden');
    addTile();addTile();render();
}

function addTile(){
    const empty=[];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board.at(r).at(c)===0)empty.push([r,c]);
    if(!empty.length)return;
    const pick=empty.at(Math.floor(Math.random()*empty.length));
    board.at(pick.at(0))[pick.at(1)]=Math.random()<0.9?2:4;
}

function render(){
    gridEl.innerHTML='';
    for(let r=0;r<4;r++){
        for(let c=0;c<4;c++){
            const v=board.at(r).at(c);
            const cell=document.createElement('div');
            cell.className='cell';
            const st=colors[v]||['#facc15','#0f172a'];
            cell.style.background=st.at(0);
            cell.style.color=st.at(1);
            if(v>=100)cell.style.fontSize='1.35rem';
            if(v>=1000)cell.style.fontSize='1.1rem';
            cell.textContent=v||'';
            gridEl.appendChild(cell);
        }
    }
}

function slide(row){
    let arr=row.filter(v=>v);
    for(let i=0;i<arr.length-1;i++){
        if(arr.at(i)===arr.at(i+1)){
            arr[i]*=2;score+=arr.at(i);arr[i+1]=0;
        }
    }
    arr=arr.filter(v=>v);
    while(arr.length<4)arr.push(0);
    return arr;
}

function move(dir){
    if(!overScreen.classList.contains('hidden'))return;
    const prev=JSON.stringify(board);
    if(dir==='LEFT'){for(let r=0;r<4;r++)board[r]=slide(board.at(r))}
    if(dir==='RIGHT'){for(let r=0;r<4;r++)board[r]=slide([...board.at(r)].reverse()).reverse()}
    if(dir==='UP'){
        for(let c=0;c<4;c++){
            const col=slide([board.at(0).at(c),board.at(1).at(c),board.at(2).at(c),board.at(3).at(c)]);
            for(let r=0;r<4;r++)board[r][c]=col.at(r);
        }
    }
    if(dir==='DOWN'){
        for(let c=0;c<4;c++){
            const col=slide([board.at(3).at(c),board.at(2).at(c),board.at(1).at(c),board.at(0).at(c)]).reverse();
            for(let r=0;r<4;r++)board[r][c]=col.at(r);
        }
    }
    if(JSON.stringify(board)!==prev){
        scoreEl.textContent=score;
        if(score>best){best=score;localStorage.setItem('best2048',best);bestEl.textContent=best}
        addTile();render();
        if(isGameOver()){finalText.textContent='Ваш счёт: '+score;overScreen.classList.remove('hidden')}
    }
}

function isGameOver(){
    for(let r=0;r<4;r++){
        for(let c=0;c<4;c++){
            const v=board.at(r).at(c);
            if(v===0)return false;
            if(c<3&&v===board.at(r).at(c+1))return false;
            if(r<3&&v===board.at(r+1).at(c))return false;
        }
    }
    return true;
}

window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(e.key==='ArrowLeft'||k==='a'||k==='ф')move('LEFT');
    if(e.key==='ArrowRight'||k==='d'||k==='в')move('RIGHT');
    if(e.key==='ArrowUp'||k==='w'||k==='ц')move('UP');
    if(e.key==='ArrowDown'||k==='s'||k==='ы')move('DOWN');
});
window.addEventListener('touchstart',e=>{const t=e.touches.item(0);if(t){tx=t.clientX;ty=t.clientY}},{passive:true});
window.addEventListener('touchend',e=>{
    const t=e.changedTouches.item(0);if(!t)return;
    const dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.abs(dx)<25&&Math.abs(dy)<25)return;
    Math.abs(dx)>Math.abs(dy)?move(dx>0?'RIGHT':'LEFT'):move(dy>0?'DOWN':'UP');
},{passive:true});

document.getElementById('newGameBtn').addEventListener('click',init);
document.getElementById('restartBtn').addEventListener('click',init);
init();
</script>
</body>
</html>
