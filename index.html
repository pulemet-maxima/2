<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX Урал Раннер</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background-color: #1e1e1e;
      font-family: 'Courier New', Courier, monospace; overflow: hidden;
    }
    #game-container {
      width: 100%; max-width: 650px; padding: 12px;
      background: #2b2b2b; border-radius: 12px; text-align: center;
    }
    .info {
      display: flex; justify-content: space-between; align-items: center;
      color: #f0f0f0; font-weight: bold; font-size: 16px; margin-bottom: 10px;
    }
    canvas {
      width: 100%; border-radius: 6px; display: block; background-color: #e3f2fd;
    }
    .controls-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; color: #bdbdbd; font-size: 13px;
    }
    button#sound-btn {
      background: #444; color: #fff; border: none; padding: 5px 10px;
      border-radius: 5px; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="info">
    <span id="status">Загрузка JS...</span>
    <span>РЕКОРД: <span id="high-score">0</span> | СЧЁТ: <span id="score">0</span></span>
  </div>
  <canvas id="gameCanvas" width="650" height="220"></canvas>
  <div class="controls-bar">
    <span>Тап или Пробел — прыжок</span>
    <button id="sound-btn">🔊 Звук: ВКЛ</button>
  </div>
</div>

<script>
  document.getElementById('status').textContent = 'Мотоциклист';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('high-score');
  const soundBtn = document.getElementById('sound-btn');

  let soundEnabled = true;
  let audioCtx = null;

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.16);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        osc.start(now); osc.stop(now + 0.16);
      } else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.start(now); osc.stop(now + 0.22);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      }
    } catch (e) {}
  }

  soundBtn.onclick = function(e) {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊 Звук: ВКЛ' : '🔇 Звук: ВЫКЛ';
  };

  let score = 0;
  let highScore = 0;
  let gameSpeed = 5.5;
  let isGameOver = false;
  let isNight = false;
  let wheelAngle = 0;
  let roadOffset = 0;
  const groundY = 185;

  const moto = { x: 45, y: groundY - 46, width: 62, height: 46, dy: 0, jumpForce: 11.5, gravity: 0.55, grounded: true };
  let obstacles = [];
  let spawnTimer = 40;
  let clouds = [{ x: 120, y: 35, size: 1 }, { x: 350, y: 55, size: 0.8 }, { x: 560, y: 30, size: 1.1 }];
  const stars = [];
  for (let i = 0; i < 25; i++) stars.push({ x: Math.random() * 650, y: Math.random() * 110 + 10, r: 1.2 });

  function jump() {
    if (isGameOver) {
      score = 0; scoreEl.textContent = 0; gameSpeed = 5.5;
      obstacles = []; moto.y = groundY - moto.height; moto.dy = 0;
      moto.grounded = true; isGameOver = false; isNight = false;
      loop();
      return;
    }
    if (moto.grounded) {
      moto.dy = -moto.jumpForce;
      moto.grounded = false;
      playSound('jump');
    }
  }

  canvas.ontouchstart = function(e) { e.preventDefault(); jump(); };
  canvas.onmousedown = jump;
  window.onkeydown = function(e) { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } };

  function drawBackground() {
    ctx.fillStyle = isNight ? '#141b29' : '#e3f2fd';
    ctx.fillRect(0, 0, 650, 220);

    if (isNight) {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < stars.length; i++) {
        ctx.beginPath(); ctx.arc(stars[i].x, stars[i].y, stars[i].r, 0, 6.28); ctx.fill();
      }
      ctx.fillStyle = '#fff9c4';
      ctx.beginPath(); ctx.arc(560, 42, 16, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#141b29';
      ctx.beginPath(); ctx.arc(553, 38, 14, 0, 6.28); ctx.fill();
    } else {
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath(); ctx.arc(560, 45, 18, 0, 6.28); ctx.fill();
    }

    ctx.fillStyle = isNight ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.9)';
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 14 * c.size, 0, 6.28);
      ctx.arc(c.x + 14 * c.size, c.y - 5 * c.size, 18 * c.size, 0, 6.28);
      ctx.arc(c.x + 30 * c.size, c.y, 14 * c.size, 0, 6.28);
      ctx.fill();
    }

    ctx.fillStyle = isNight ? '#263238' : '#546e7a';
    ctx.fillRect(0, groundY, 650, 35);

    ctx.fillStyle = isNight ? '#90a4ae' : '#eceff1';
    for (let x = -roadOffset; x < 650; x += 45) ctx.fillRect(x, groundY + 14, 24, 4);
  }

  function drawWheel(cx, cy, r) {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.28); ctx.stroke();
    ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = wheelAngle + i * 0.785;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
      ctx.lineTo(cx - Math.cos(a) * (r - 2), cy - Math.sin(a) * (r - 2));
      ctx.stroke();
    }
  }

  function drawUralMoto() {
    const x = moto.x, y = moto.y;
    if (isNight) {
      ctx.fillStyle = 'rgba(255, 249, 196, 0.25)';
      ctx.beginPath();
      ctx.moveTo(x + 56, y + 18); ctx.lineTo(x + 165, y - 5);
      ctx.lineTo(x + 165, y + 45); ctx.lineTo(x + 56, y + 24);
      ctx.fill();
    }
    ctx.fillStyle = '#263238'; ctx.fillRect(x + 18, y + 10, 14, 18);
    ctx.strokeStyle = '#263238'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x + 28, y + 14); ctx.lineTo(x + 42, y + 17); ctx.stroke();

    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(x + 26, y + 5, 7, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#81d4fa'; ctx.fillRect(x + 28, y + 2, 5, 4);
    ctx.fillStyle = '#1a237e'; ctx.fillRect(x + 22, y + 25, 6, 12);

    ctx.fillStyle = '#33691e';
    ctx.beginPath(); ctx.moveTo(x + 10, y + 32); ctx.lineTo(x + 24, y + 22);
    ctx.lineTo(x + 44, y + 22); ctx.lineTo(x + 48, y + 34); ctx.fill();

    ctx.fillStyle = '#558b2f';
    ctx.beginPath(); ctx.moveTo(x + 14, y + 34); ctx.lineTo(x + 18, y + 25);
    ctx.lineTo(x + 48, y + 27); ctx.lineTo(x + 54, y + 34); ctx.fill();

    ctx.strokeStyle = '#b3e5fc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 36, y + 26); ctx.lineTo(x + 33, y + 19); ctx.stroke();

    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 42, y + 16); ctx.lineTo(x + 52, y + 36); ctx.stroke();

    ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(x + 53, y + 21, 3.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#b0bec5'; ctx.fillRect(x + 4, y + 35, 22, 3);

    drawWheel(x + 12, y + 37, 9);
    drawWheel(x + 52, y + 37, 9);
  }

  function drawTrafficLight(obs) {
    const cx = obs.x + obs.width / 2;
    ctx.fillStyle = '#78909c'; ctx.fillRect(cx - 2.5, obs.y + 24, 5, obs.height - 24);
    ctx.fillStyle = '#455a64'; ctx.fillRect(cx - 7, obs.y + obs.height - 4, 14, 4);
    ctx.fillStyle = '#212121'; ctx.fillRect(cx - 8, obs.y, 16, 34);
    const colors = ['#ff1744', '#ffea00', '#00e676'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = colors[i];
      ctx.beginPath(); ctx.arc(cx, obs.y + 6 + i * 11, 3.2, 0, 6.28); ctx.fill();
    }
  }

  function loop() {
    if (isGameOver) return;

    roadOffset = (roadOffset + gameSpeed) % 45;
    if (moto.grounded) wheelAngle += gameSpeed * 0.06;

    for (let i = 0; i < clouds.length; i++) {
      clouds[i].x -= gameSpeed * 0.25;
      if (clouds[i].x < -60) clouds[i].x = 690;
    }

    moto.y += moto.dy;
    if (moto.y + moto.height < groundY) {
      moto.dy += moto.gravity;
      moto.grounded = false;
    } else {
      moto.y = groundY - moto.height;
      moto.dy = 0;
      moto.grounded = true;
    }

    spawnTimer--;
    if (spawnTimer <= 0) {
      const h = Math.random() > 0.45 ? 52 : 42;
      obstacles.push({ x: 660, y: groundY - h, width: 18, height: h });
      spawnTimer = Math.floor(Math.random() * 55) + 60;
    }

    drawBackground();
    drawUralMoto();

    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= gameSpeed;
      drawTrafficLight(obs);

      if (
        moto.x + 8 < obs.x + obs.width - 3 &&
        moto.x + moto.width - 8 > obs.x + 3 &&
        moto.y + 6 < obs.y + obs.height &&
