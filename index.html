<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра — Мини-проекты</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: #0f172a;
            color: #f8fafc;
        }
        .card {
            background: #1e293b;
            padding: 2.25rem 2rem;
            border-radius: 18px;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 999px;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 0.6rem;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        p {
            margin: 0 0 1.75rem;
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: #172033;
            border-color: #475569;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: #facc15;
            color: #0f172a;
            border-color: #facc15;
        }
        .btn-primary:hover {
            background: #fde047;
            border-color: #fde047;
        }
        .btn.full {
            grid-column: span 2;
        }
        .btn.soon {
            color: #94a3b8;
            border-style: dashed;
        }
        .tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 6px;
            background: #1e293b;
            color: #64748b;
            font-weight: 600;
        }
        #status {
            margin-top: 1.15rem;
            min-height: 1.3em;
            font-size: 0.88rem;
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Мини-игры</div>
        <h1>Игра</h1>
        <p>Выберите мини-игру для запуска.</p>
        
        <div class="actions">
            <a href="game.html" class="btn btn-primary">⭐ Ловец звёзд</a>
            <a href="page2.html" class="btn">🐍 Змейка</a>
            <a href="page3.html" class="btn full soon">Раздел 3 <span class="tag">Скоро</span></a>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');

        document.querySelectorAll('.btn.soon').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                const title = link.childNodes.textContent.trim();
                statusEl.textContent = `«${title}» пока в разработке`;
            });
        });
    </script>
</body>
</html>
