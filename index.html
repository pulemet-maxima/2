<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Мини-проекты</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px;background:#0f172a;color:#f8fafc}
.card{background:#1e293b;padding:2.25rem 2rem;border-radius:18px;border:1px solid #334155;box-shadow:0 20px 40px rgba(0,0,0,.35);width:100%;max-width:420px;text-align:center}
.badge{display:inline-block;padding:4px 12px;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#38bdf8;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);border-radius:999px;margin-bottom:1rem}
h1{margin:0 0 .6rem;font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 1.75rem;color:#94a3b8;font-size:.95rem;line-height:1.55}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:.9rem 1rem;font-size:.95rem;font-weight:600;border-radius:12px;cursor:pointer;text-decoration:none;border:1px solid #334155;background:#0f172a;color:#e2e8f0;transition:background .2s,border-color .2s,transform .1s}
.btn:hover{background:#172033;border-color:#475569}
.btn:active{transform:scale(.98)}
.btn-primary{background:#facc15;color:#0f172a;border-color:#facc15}
.btn-primary:hover{background:#fde047;border-color:#fde047}
.btn.full{grid-column:span 2}
</style>
</head>
<body>
<div class="card">
<div class="badge">Мини-игры</div>
<h1>Игра</h1>
<p>Выберите мини-игру для запуска.</p>
<div class="actions">
<a href="game.html" class="btn btn-primary">⭐ Ловец звёзд</a>
<a href="page2.html" class="btn">🐍 Змейка</a>
<a href="page3.html" class="btn full">🔢 2048</a>
</div>
</div>
</body>
</html>
