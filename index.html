<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX Dino Runner</title>
  <!-- Подключаем SDK для Mini App мессенджера MAX -->
  <script src="https://max.ru"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f7f7f7;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 600px;
      padding: 10px;
      text-align: center;
    }
    canvas {
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid #535353;
      display: block;
    }
    .info {
      display: flex;
      justify-content: space-between;
      color: #535353;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }
    .hint {
      margin-top: 12px;
      color: #757575;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="info">
    <span id="player-name">Игрок</span>
    <span>РЕКОРД: <span id="high-score">0</span> | СЧЁТ: <span id="score">0</span></span>
  </div>
  <canvas id="gameCanvas" width="600" height="200"></canvas>
  <div class="hint">Нажмите на экран или Пробел, чтобы прыгнуть</div>
</div>

<script>
  // Инициализация MAX Mini App (если открыто внутри мессенджера)
  if (window.WebApp) {
    window.WebApp.ready();
    const user = window.WebApp.initDataUnsafe?.user;
    if (user && user.first_name) {
      document.getElementById('player-name').textContent = user.first_name;
    }
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('high-score');

  let score = 0;
  let highScore = localStorage.getItem('maxDinoHighScore') || 0;
  highScoreEl.textContent = highScore;

  let gameSpeed = 5;
  let isGameOver = false;
  let animationId;

  // Параметры динозавра
  const dino = {
    x: 40,
    y: 150,
    width: 30,
    height: 40,
    dy: 0,
    jumpForce: 11,
    gravity: 0.55,
    grounded: true
  };

  // Массив препятствий (кактусов)
  let obstacles = [];
  let spawnTimer = 0;

  function jump() {
    if (isGameOver) {
      resetGame();
      return;
    }
    if (dino.grounded) {
      dino.dy = -dino.jumpForce;
      dino.grounded = false;
    }
  }

  // Управление: тап по экрану или клавиатура
  window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    jump();
  }, { passive: false });
  window.addEventListener('mousedown', jump);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      jump();
    }
  });

  function spawnObstacle() {
    const height = Math.random() > 0.5 ? 35 : 22;
    const width = Math.random() > 0.5 ? 20 : 15;
    obstacles.push({
      x: canvas.width,
      y: canvas.height - height - 10,
      width: width,
      height: height
    });
  }

  function resetGame() {
    score = 0;
    gameSpeed = 5;
    obstacles = [];
    dino.y = 150;
    dino.dy = 0;
    isGameOver = false;
    update();
  }

  function drawDino() {
    ctx.fillStyle = '#535353';
    // Тело
    ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
    // Глаз
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(dino.x + 20, dino.y + 6, 4, 4);
  }

  function drawObstacles() {
    ctx.fillStyle = '#2e7d32';
    obstacles.forEach(obs => {
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    });
  }

  function update() {
    if (isGameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Физика прыжка
    dino.y += dino.dy;
    if (dino.y + dino.height < canvas.height - 10) {
      dino.dy += dino.gravity;
      dino.grounded = false;
    } else {
      dino.y = canvas.height - dino.height - 10;
      dino.dy = 0;
      dino.grounded = true;
    }

    // Генерация кактусов
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.floor(Math.random() * 60) + 65;
    }

    // Движение и проверка столкновений
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= gameSpeed;

      // Проверка столкновения
      if (
        dino.x < obs.x + obs.width &&
        dino.x + dino.width > obs.x &&
        dino.y < obs.y + obs.height &&
        dino.y + dino.height > obs.y
      ) {
        isGameOver = true;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('maxDinoHighScore', highScore);
          highScoreEl.textContent = highScore;
        }
        drawGameOver();
        return;
      }

      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
        score++;
        scoreEl.textContent = score;
        if (score % 5 === 0) gameSpeed += 0.3; // Ускорение игры
      }
    }

    drawDino();
    drawObstacles();

    animationId = requestAnimationFrame(update);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 24px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, 90);
    ctx.font = '16px Courier New';
    ctx.fillText('Нажмите, чтобы начать заново', canvas.width / 2, 120);
  }

  update();
</script>

</body>
</html>
