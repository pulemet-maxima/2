<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой тестовый сайт</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f4f8;
            color: #1e293b;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 420px;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: #64748b; line-height: 1.5; }
        button {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #16a34a;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Сайт успешно запущен!</h1>
        <p>Это тестовая страница, размещенная прямо из вашего репозитория на GitHub.</p>
        <button id="btn">Проверить интерактив</button>
        <div id="status"></div>
    </div>

    <script>
        let clicks = 0;
        document.getElementById('btn').addEventListener('click', () => {
            clicks++;
            document.getElementById('status').textContent = `Кнопка нажата: ${clicks} раз(а)`;
        });
    </script>
</body>
</html>
