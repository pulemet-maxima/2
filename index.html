<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX Ural Runner</title>
  <script src="https://max.ru"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #1e1e1e;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 620px;
      padding: 12px;
      background: #2b2b2b;
      border-radius: 10px;
      text-align: center;
    }
    canvas {
      width: 100%;
      background: #e3f2fd;
      border-radius: 6px;
      display: block;
    }
    .info {
      display: flex;
      justify-content: space-between;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .hint {
      margin-top: 10px;
      color: #bdbdbd;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #sound-btn {
      background: #444;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="info">
    <span id="player-name">Мотоциклист</span>
    <span>РЕКОРД: <span id="high-score">0</span> | СЧЁТ: <span id="score">0</span></span>
  </div>
  <canvas id="gameCanvas" width="620" height="210"></canvas>
  <div class="hint">
    <span>Нажмите на экран или Пробел — прыжок</span>
    <button id="sound-btn">🔊 Звук: ВКЛ</button>
  </div>
</div>

<script>
  try {
    if (window.WebApp) {
      window.WebApp.ready();
      const user = window.WebApp.initDataUnsafe?.user;
      if (user && user.first_name) {
        document.getElementById('player-name').textContent = user.first_name;
      }
    }
  } catch (e) {}

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('high-score');
  const soundBtn = document.getElementById('sound-btn');

  let soundEnabled = true;
  let audioCtx = null;

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊 Звук: ВКЛ' : '🔇 Звук: ВЫКЛ';
  });

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    } catch (e) {}
  }

  let score = 0;
  let highScore = 0;
  try {
    highScore = localStorage.getItem('maxUralHighScore') || 0;
  } catch (e) {}
  highScoreEl.textContent = highScore;

  let gameSpeed = 5.5;
  let isGameOver = false;
  let isNight = false;
  let wheelAngle = 0;
  let roadOffset = 0;
  const groundY = 175;

  const moto = {
    x: 40,
    y: groundY - 46,
    width: 62,
    height: 46,
    dy: 0,
    jumpForce: 11.5,
    gravity: 0.55,
    grounded: true
  };

  let obstacles = [];
  let spawnTimer = 0;

  const clouds = [
    { x: 110, y: 35, size: 1 },
    { x: 340, y: 50, size: 0.8 },
    { x: 540, y: 30, size: 1.1 }
  ];

  const stars = [];
  for (let i = 0; i < 24; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * 100 + 10,
      r: Math.random() * 1.4 + 0.6
    });
  }

  function jump() {
    if (isGameOver) {
      resetGame();
      return;
    }
    if (moto.grounded) {
      moto.dy = -moto.jumpForce;
      moto.grounded = false;
      playSound('jump');
    }
  }

  document.addEventListener('touchstart', (e) => {
    if (e.target.id === 'sound-btn') return;
    e.preventDefault();
    jump();
  }, { passive: false });
  canvas.addEventListener('mousedown', jump);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });

  function spawnObstacle() {
    const height = Math.random() > 0.45 ? 50 : 40;
    obstacles.push({
      x: canvas.width + 10,
      y: groundY - height,
      width: 18,
      height: height
    });
  }

  function resetGame() {
    score = 0;
    scoreEl.textContent = 0;
    gameSpeed = 5.5;
    obstacles = [];
    moto.y = groundY - moto.height;
    moto.dy = 0;
    moto.grounded = true;
    isGameOver = false;
    isNight = false;
    update();
  }

  function drawBackground() {
    ctx.fillStyle = isNight ? '#141b29' : '#e3f2fd';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (isNight) {
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = '#fff9c4';
      ctx.beginPath();
      ctx.arc(540, 40, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#141b29';
      ctx.beginPath();
      ctx.arc(533, 36, 13, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(540, 42, 17, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = isNight ? 'rgba(255, 255, 255, 0.14)' : 'rgba(255, 255, 255, 0.9)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 13 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 13 * c.size, c.y - 5 * c.size, 17 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 28 * c.size, c.y, 13 * c.size, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = isNight ? '#263238' : '#546e7a';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.fillStyle = isNight ? '#90a4ae' : '#eceff1';
    for (let x = -roadOffset; x < canvas.width; x += 45) {
      ctx.fillRect(x, groundY + 14, 24, 4);
    }
  }

  function drawWheel(cx, cy, r) {
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#cfd8dc';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = wheelAngle + (i * Math.PI) / 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
      ctx.lineTo(cx - Math.cos(a) * (r - 2), cy - Math.sin(a) * (r - 2));
      ctx.stroke();
    }
  }

  function drawUralMoto() {
    const x = moto.x;
    const y = moto.y;

    if (isNight) {
      ctx.fillStyle = 'rgba(255, 249, 196, 0.25)';
      ctx.beginPath();
      ctx.moveTo(x + 56, y + 18);
      ctx.lineTo(x + 165, y - 5);
      ctx.lineTo(x + 165, y + 45);
      ctx.lineTo(x + 56, y + 24);
      ctx.fill();
    }

    ctx.fillStyle = '#263238';
    ctx.fillRect(x + 18, y + 10, 14, 18);

    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x + 28, y + 14);
    ctx.lineTo(x + 42, y + 17);
    ctx.stroke();

    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.arc(x + 26, y + 5, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#81d4fa';
    ctx.fillRect(x + 28, y + 2, 5, 4);

    ctx.fillStyle = '#1a237e';
    ctx.fillRect(x + 22, y + 25, 6, 12);

    ctx.fillStyle = '#33691e';
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 32);
    ctx.lineTo(x + 24, y + 22);
    ctx.lineTo(x + 44, y + 22);
    ctx.lineTo(x + 48, y + 34);
    ctx.fill();

    ctx.fillStyle = '#558b2f';
    ctx.beginPath();
    ctx.moveTo(x + 14, y + 34);
    ctx.lineTo(x + 18, y + 25);
    ctx.lineTo(x + 48, y + 27);
    ctx.lineTo(x + 54, y + 34);
    ctx.fill();

    ctx.strokeStyle = '#b3e5fc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 36, y + 26);
    ctx.lineTo(x + 33, y + 19);
    ctx.stroke();

    ctx.strokeStyle = '#90a4ae';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 42, y + 16);
    ctx.lineTo(x + 52, y + 36);
    ctx.stroke();

    ctx.fillStyle = '#fff59d';
    ctx.beginPath();
    ctx.arc(x + 53, y + 21, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(x + 4, y + 35, 22, 3);

    drawWheel(x + 12, y + 37, 9);
    drawWheel(x + 52, y + 37, 9);
  }

  function drawTrafficLight(obs) {
    const cx = obs.x + obs.width / 2;

    ctx.fillStyle = '#78909c';
    ctx.fillRect(cx - 2.5, obs.y + 24, 5, obs.height - 24);

    ctx.fillStyle = '#455a64';
    ctx.fillRect(cx - 7, obs.y + obs.height - 4, 14, 4);

    ctx.fillStyle = '#212121';

'#263238';
    ctx.fillRect(x + 18, y + 10, 14, 18);

    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x + 28, y + 14);
    ctx.lineTo(x + 42, y + 17);
    ctx.stroke();

    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.arc(x + 26, y + 5, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#81d4fa';
    ctx.fillRect(x + 28, y + 2, 5, 4);

    ctx.fillStyle = '#1a237e';
    ctx.fillRect(x + 22, y + 25, 6, 12);

    ctx.fillStyle = '#33691e';
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 32);
    ctx.lineTo(x + 24, y + 22);
    ctx.lineTo(x + 44, y + 22);
    ctx.lineTo(x + 48, y + 34);
    ctx.fill();

    ctx.fillStyle = '#558b2f';
    ctx.beginPath();
    ctx.moveTo(x + 14, y + 34);
    ctx.lineTo(x + 18, y + 25);
    ctx.lineTo(x + 48, y + 27);
    ctx.lineTo(x + 54, y + 34);
    ctx.fill();

    ctx.strokeStyle = '#b3e5fc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 36, y + 26);
    ctx.lineTo(x + 33, y + 19);
    ctx.stroke();

    ctx.strokeStyle = '#90a4ae';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 42, y + 16);
    ctx.lineTo(x + 52, y + 36);
    ctx.stroke();

    ctx.fillStyle = '#fff59d';
    ctx.beginPath();
    ctx.arc(x + 53, y + 21, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(x + 4, y + 35, 22, 3);

    drawWheel(x + 12, y + 37, 9);
    drawWheel(x + 52, y + 37, 9);
  }

  function drawTrafficLight(obs) {
    const cx = obs.x + obs.width / 2;

    ctx.fillStyle = '#78909c';
    ctx.fillRect(cx - 2.5, obs.y + 24, 5, obs.height - 24);

    ctx.fillStyle = '#455a64';
    ctx.fillRect(cx - 7, obs.y + obs.height - 4, 14, 4);

    ctx.fillStyle = '#212121';
    ctx.fillRect(cx - 8, obs.y, 16, 34);

    const colors = ['#ff1744', '#ffea00', '#00e676'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = colors[i];
      ctx.beginPath();
      ctx.arc(cx, obs.y + 6 + i * 11, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function update() {
    if (isGameOver) return;

    roadOffset = (roadOffset + gameSpeed) % 45;
    if (moto.grounded) {
      wheelAngle += gameSpeed * 0.06;
    }

    clouds.forEach(c => {
      c.x -= gameSpeed * 0.25;
      if (c.x < -60) c.x = canvas.width + 40;
    });

    moto.y += moto.dy;
    if (moto.y + moto.height < groundY) {
      moto.dy += moto.gravity;
      moto.grounded = false;
    } else {
      moto.y = groundY - moto.height;
      moto.dy = 0;
      moto.grounded = true;
    }

    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.floor(Math.random() * 55) + 60;
    }

    drawBackground();
    drawUralMoto();

    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= gameSpeed;

      drawTrafficLight(obs);

      if (
        moto.x + 8 < obs.x + obs.width - 3 &&
        moto.x + moto.width - 8 > obs.x + 3 &&
        moto.y + 6 < obs.y + obs.height &&
        moto.y + moto.height > obs.y + 4
      ) {
        isGameOver = true;
        playSound('crash');
        if (score > highScore) {
          highScore = score;
          try {
            localStorage.setItem('maxUralHighScore', highScore);
          } catch (e) {}
          highScoreEl.textContent = highScore;
        }
        drawGameOver();
        return;
      }

      if (obs.x + obs.width < -10) {
        obstacles.splice(i, 1);
        score++;
        scoreEl.textContent = score;
        if (score % 10 === 0) {
          playSound('score');
          gameSpeed += 0.4;
        }
        if (score % 15 === 0) {
          isNight = !isNight;
        }
      }
    }

    requestAnimationFrame(update);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('АВАРИЯ НА ПЕРЕКРЁСТКЕ!', canvas.width / 2, 95);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#ffeb3b';
    ctx.fillText('Нажмите на экран или Пробел, чтобы поехать снова', canvas.width / 2, 130);
  }

  update();
</script>

</body>
</html>
