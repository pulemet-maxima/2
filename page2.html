<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Змейка</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 0 24px;min-height:100dvh;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:380px;padding:8px 16px 12px;font-weight:600;font-size:1.05rem}
.back-link{color:#94a3b8;text-decoration:none;font-size:.95rem}
.canvas-wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5);border:2px solid #1e293b;max-width:92vw}
canvas{display:block;width:100%;max-width:360px;aspect-ratio:1/1;background:#090d16;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.88);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.hidden{display:none!important}
h1{margin:0 0 8px;font-size:1.65rem;color:#38bdf8}
p{margin:0 0 18px;color:#cbd5e1;font-size:.95rem;line-height:1.4}
.start-btn{padding:13px 30px;font-size:1.05rem;font-weight:700;color:#0f172a;background:#38bdf8;border:none;border-radius:12px;cursor:pointer}
.controls{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,54px);gap:8px;margin-top:16px}
.ctrl-btn{background:#1e293b;border:1px solid #334155;border-radius:12px;color:#e2e8f0;font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.ctrl-btn:active{background:#334155;transform:scale(.95)}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back-link">← На главную</a>
<div>Счёт: <span id="score">0</span></div>
<div>🏆 <span id="best">0</span></div>
</div>
<div class="canvas-wrap">
<canvas id="game" width="360" height="360"></canvas>
<div id="startScreen" class="overlay">
<h1>🐍 Змейка</h1>
<p>Собирай кристаллы и не врезайся в стены или хвост.</p>
<button id="startBtn" class="start-btn">Играть</button>
</div>
<div id="gameOverScreen" class="overlay hidden">
<h1 style="color:#f87171">💥 Игра окончена!</h1>
<p id="finalScoreText">Ваш счёт: 0</p>
<button id="restartBtn" class="start-btn">Сыграть ещё</button>
</div>
</div>
<div class="controls">
<button class="ctrl-btn up" data-dir="UP">▲</button>
<button class="ctrl-btn left" data-dir="LEFT">◀</button>
<button class="ctrl-btn down" data-dir="DOWN">▼</button>
<button class="ctrl-btn right" data-dir="RIGHT">▶</button>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startScreen=document.getElementById('startScreen'),gameOverScreen=document.getElementById('gameOverScreen'),finalScoreText=document.getElementById('finalScoreText'),grid=18,tiles=canvas.width/grid;
let best=Number(localStorage.getItem('snakeBest'))||0;bestEl.textContent=best;
let snake=[],food={x:10,y:10},dx=0,dy=0,ndx=0,ndy=0,score=0,playing=false,timer=null,tx=0,ty=0;
function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dx=ndx=1;dy=ndy=score=0;scoreEl.textContent=0;playing=true;startScreen.classList.add('hidden');gameOverScreen.classList.add('hidden');spawn();clearTimeout(timer);loop()}
function end(){playing=false;clearTimeout(timer);if(score>best){best=score;localStorage.setItem('snakeBest',best);bestEl.textContent=best}finalScoreText.textContent='Ваш счёт: '+score;gameOverScreen.classList.remove('hidden')}
function spawn(){while(true){const x=Math.floor(Math.random()*tiles),y=Math.floor(Math.random()*tiles);if(!snake.some(s=>s.x===x&&s.y===y)){food={x,y};break}}}
function dir(d){if(!playing)return;if(d==='UP'&&dy===0){ndx=0;ndy=-1}if(d==='DOWN'&&dy===0){ndx=0;ndy=1}if(d==='LEFT'&&dx===0){ndx=-1;ndy=0}if(d==='RIGHT'&&dx===0){ndx=1;ndy=0}}
function update(){dx=ndx;dy=ndy;const h={x:snake.at(0).x+dx,y:snake.at(0).y+dy};if(h.x<0||h.x>=tiles||h.y<0||h.y>=tiles||snake.some(s=>s.x===h.x&&s.y===h.y))return end();snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;spawn()}else snake.pop()}
function draw(){ctx.fillStyle='#090d16';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(food.x*grid+grid/2,food.y*grid+grid/2,grid/2.6,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#38bdf8':'#0284c7';ctx.beginPath();ctx.roundRect(s.x*grid+1,s.y*grid+1,grid-2,grid-2,5);ctx.fill()})}
function loop(){if(!playing)return;update();if(playing){draw();timer=setTimeout(loop,Math.max(65,130-score*2))}}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowUp'||k==='w'||k==='ц')dir('UP');if(e.key==='ArrowDown'||k==='s'||k==='ы')dir('DOWN');if(e.key==='ArrowLeft'||k==='a'||k==='ф')dir('LEFT');if(e.key==='ArrowRight'||k==='d'||k==='в')dir('RIGHT')});
document.querySelectorAll('.ctrl-btn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dir(b.dataset.dir)}));
canvas.addEventListener('touchstart',e=>{tx=e.touches.item(0).clientX;ty=e.touches.item(0).clientY},{passive:true});
canvas.addEventListener('touchend',e=>{if(!playing)return;const x=e.changedTouches.item(0).clientX-tx,y=e.changedTouches.item(0).clientY-ty;if(Math.abs(x)<20&&Math.abs(y)<20)return;Math.abs(x)>Math.abs(y)?dir(x>0?'RIGHT':'LEFT'):dir(y>0?'DOWN':'UP')},{passive:true});
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('restartBtn').addEventListener('click',start);
</script>
</body>
</html>
