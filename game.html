
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ловец звёзд — Мини-игра</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 12px;
            padding-bottom: 90px;
            min-height: 100dvh;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 8px 16px 12px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }
        .canvas-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid #1e293b;
            max-width: 94vw;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 380px;
            max-height: 68dvh;
            background: linear-gradient(180deg, #090d16 0%, #1e1b4b 100%);
            touch-action: none;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { margin: 0 0 8px; font-size: 1.8rem; color: #facc15; }
        p { margin: 0 0 20px; color: #cbd5e1; line-height: 1.4; }
        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            background: #facc15;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #fde047; transform: scale(1.03); }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-link">← На главную</a>
        <div>Счёт: <span id="score">0</span></div>
        <div>🏆 <span id="best">0</span></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="game" width="380" height="540"></canvas>
        
        <div id="startScreen" class="overlay">
            <h1>⭐ Ловец звёзд</h1>
            <p>Двигай платформу мышкой, пальцем или стрелками.<br>Лови звёзды и уворачивайся от метеоритов!</p>
            <button id="startBtn">Играть</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: #f87171;">💥 Игра окончена!</h1>
            <p id="finalScoreText">Ваш счёт: 0</p>
            <button id="restartBtn">Сыграть ещё</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreText = document.getElementById('finalScoreText');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        let bestScore = Number(localStorage.getItem('starCatcherBest')) || 0;
        bestEl.textContent = bestScore;

        let score = 0;
        let isPlaying = false;
        let items = [];
        let spawnTimer = 0;
        let keys = { ArrowLeft: false, ArrowRight: false };

        const paddle = {
            width: 80,
            height: 14,
            x: canvas.width / 2 - 40,
            y: canvas.height - 55,
            speed: 7
        };

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            items = [];
            spawnTimer = 0;
            paddle.x = canvas.width / 2 - paddle.width / 2;
            isPlaying = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isPlaying = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('starCatcherBest', bestScore);
                bestEl.textContent = bestScore;
            }
            finalScoreText.textContent = `Ваш счёт: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        function spawnItem() {
            const isMeteor = Math.random() < Math.min(0.25 + score * 0.005, 0.55);
            const size = isMeteor ? 28 : 26;
            items.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: 3 + Math.random() * 2 + score * 0.05,
                type: isMeteor ? 'meteor' : 'star'
            });
        }

        function update() {
            if (keys.ArrowLeft) paddle.x -= paddle.speed;
            if (keys.ArrowRight) paddle.x += paddle.speed;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            spawnTimer++;
            const spawnRate = Math.max(22, 48 - Math.floor(score / 2));
            if (spawnTimer >= spawnRate) {
                spawnItem();
                spawnTimer = 0;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;

                const hitPaddle =
                    item.y + item.size >= paddle.y &&
                    item.y <= paddle.y + paddle.height &&
                    item.x + item.size >= paddle.x &&
                    item.x <= paddle.x + paddle.width;

                if (hitPaddle) {
                    if (item.type === 'meteor') {
                        endGame();
                        return;
                    } else {
                        score++;
                        scoreEl.textContent = score;
                        items.splice(i, 1);
                        continue;
                    }
                }

                if (item.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Платформа
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fill();

            // Падающие объекты
            ctx.font = '24px sans-serif';
            ctx.textBaseline = 'top';
            for (const item of items) {
                ctx.fillText(item.type === 'meteor' ? '☄️' : '⭐', item.x, item.y);
            }
        }

        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            if (isPlaying) requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', e => {
            if (e.key in keys) keys[e.key] = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key in keys) keys[e.key] = false;
        });

        function movePaddleToClientX(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const relX = (clientX - rect.left) * scaleX;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relX - paddle.width / 2));
        }

        canvas.addEventListener('mousemove', e => {
            if (isPlaying) movePaddleToClientX(e.clientX);
        });
        canvas.addEventListener('touchmove', e => {
            if (isPlaying && e.touches.length > 0) {
                e.preventDefault();
                movePaddleToClientX(e.touches[0].clientX);
            }
        }, { passive: false });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
